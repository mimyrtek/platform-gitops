apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-dev-controller
  namespace: jenkins-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-dev-agent-manager
  namespace: jenkins-dev
rules:
  # Jenkins Kubernetes plugin creates agent pods, watches them, streams logs, execs steps
  - apiGroups: [""]
    resources:
      - pods
      - pods/exec
      - pods/log
      - pods/status
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]

  # Often needed for agent services / pod discovery (safe in-namespace)
  - apiGroups: [""]
    resources:
      - services
      - endpoints
      - configmaps
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]

  # Only if you use imagePullSecrets or mount secrets into agents (common)
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]

  # If you ever use job-based agents or helper jobs
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-dev-agent-manager
  namespace: jenkins-dev
subjects:
  - kind: ServiceAccount
    name: jenkins-dev-controller
    namespace: jenkins-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-dev-agent-manager
