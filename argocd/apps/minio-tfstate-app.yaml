apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-tfstate
  namespace: argocd
spec:
  project: platform

  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: minio
      targetRevision: 17.0.21
      helm:
        releaseName: minio-tfstate
        valueFiles:
          - $values/argocd/helm-values/minio/tfstate-values.yaml

    - repoURL: https://github.com/mimyrtek/platform-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: tf-state

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
